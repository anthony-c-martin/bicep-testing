name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  USE_NIGHTLY: false

jobs:
  node:
    name: Node
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/node

    steps:
    - uses: actions/checkout@v7

    - name: Set up Node
      uses: actions/setup-node@v7
      with:
        node-version: 24

    - name: npm ci
      run: npm ci --legacy-peer-deps

    - name: npm test
      run: npm test

    - name: Check public API
      run: npm run api:check

  dotnet:
    name: C#
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Test and check public API
      run: dotnet test packages/dotnet/BicepTest.slnx --configuration Release

  go:
    name: Go
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: packages/go/go.mod

    - name: Test
      working-directory: packages/go
      run: go test ./...

    - name: Check public API
      working-directory: packages/go
      run: go run ./internal/apidoc --check

  powershell:
    name: PowerShell
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Install PowerShell 7.6
      shell: bash
      run: dotnet tool install --global PowerShell --version '7.6.*'

    - name: Install Pester
      shell: bash
      run: ~/.dotnet/tools/pwsh -NoProfile -Command 'Install-Module Pester -MinimumVersion 5.7.1 -Scope CurrentUser -Force'

    - name: Build
      shell: bash
      run: ~/.dotnet/tools/pwsh -NoProfile -File ./packages/powershell/build.ps1

    - name: Test
      shell: bash
      run: ~/.dotnet/tools/pwsh -NoProfile -Command 'Invoke-Pester ./packages/powershell/test -CI'

    - name: Check public API
      shell: bash
      run: ~/.dotnet/tools/pwsh -NoProfile -File ./packages/powershell/scripts/public-api.ps1 -Check

  python:
    name: Python
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'
        cache: pip
        cache-dependency-path: packages/python/pyproject.toml

    - name: Install
      run: python -m pip install -e './packages/python[test]'

    - name: Test
      run: python -m pytest packages/python/tests

    - name: Check public API
      run: python packages/python/scripts/public_api.py --check

  java:
    name: Java
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Java
      uses: actions/setup-java@v5
      with:
        distribution: microsoft
        java-version: '17'
        cache: maven

    - name: Test
      working-directory: packages/java
      run: mvn --batch-mode --no-transfer-progress test

    - name: Check public API
      working-directory: packages/java
      run: >-
        mvn --batch-mode --no-transfer-progress --quiet
        -DskipTests test-compile exec:java
        -Dexec.classpathScope=test
        -Dexec.mainClass=com.github.anthonycmartin.biceptesting.ApiSurface
        -Dexec.args=--check

  samples:
    name: Samples
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Node
      uses: actions/setup-node@v7
      with:
        node-version: 24

    - name: Set up .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Install PowerShell 7.6
      shell: bash
      run: dotnet tool install --global PowerShell --version '7.6.*'

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: samples/go/go.mod

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'

    - name: Set up Java
      uses: actions/setup-java@v5
      with:
        distribution: microsoft
        java-version: '17'
        cache: maven

    - name: Install Pester
      shell: bash
      run: ~/.dotnet/tools/pwsh -NoProfile -Command 'Install-Module Pester -MinimumVersion 5.7.1 -Scope CurrentUser -Force'

    - name: Compile and run samples
      shell: bash
      run: ~/.dotnet/tools/pwsh -NoProfile -File ./scripts/ValidateSamples.ps1